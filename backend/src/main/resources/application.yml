spring:
  application:
    name: investeai-backend

  config:
    import: optional:file:./.env[.properties]

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/investeai}
    username: ${SPRING_DATASOURCE_USERNAME:investeai}
    password: ${SPRING_DATASOURCE_PASSWORD:investeai}

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:2MB}
      max-request-size: ${MAX_REQUEST_SIZE:3MB}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

rate-limit:
  requests-per-minute: ${RATE_LIMIT_RPM:60}
  auth-requests-per-minute: ${RATE_LIMIT_AUTH_RPM:10}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:8081,http://localhost:19006,http://localhost:3000,http://localhost:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: InvesteAI Backend
    version: 0.1.0
    description: InvesteAI backend API
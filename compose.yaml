services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile

    env_file:
      - ./api/.env

    environment:
      POSTGRES_HOST: db

    ports:
      - "8080:8080"

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    restart: unless-stopped
    env_file:
      - ./api/.env
    ports:
      - "5432:5432"
    volumes:
      - investeai_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  investeai_data: